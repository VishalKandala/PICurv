# ===================================================================
# Plane channel regression grid (tests/smoke/run_driven_periodic_regression.sh)
#
# Same geometry as plane_channel_laminar.cfg - a Cartesian box of
# 1 x 2 x 1, so a uniform streamwise velocity U_b = 1 carries a
# volumetric flux of exactly U_b * Lx * Ly = 2.0, which is what the
# initial_flux latch assertion checks against.
#
# Sized for RANK ROBUSTNESS rather than for physics. The regression runs
# at 4 and 10 ranks, and PETSc may factor 10 as 1 x 2 x 5, putting five
# ranks on one axis. Every multigrid level must still leave each rank at
# least `stencil_width` nodes per axis, and the stencil width is 3
# whenever any axis is periodic. With 33 cells per axis and 2 multigrid
# levels the coarse grid is 17 cells = 18 nodes per axis, so even a
# 5-way split leaves 3.6 nodes per rank.
#
# Do not shrink these counts without redoing that arithmetic; the failure
# mode is an abort during DM creation reading
#   "Local x-width of domain x 2 is smaller than stencil width s 3".
# ===================================================================

[warp]
ncells_i = 33
ncells_j = 33
ncells_k = 33

bounds_x = 0.0 1.0
bounds_y = 0.0 2.0
bounds_z = 0.0 1.0
origin = 0.0 0.0 0.0

# Zero amplitudes => identity warp => exactly Cartesian.
amp_A = 0.0
amp_B = 0.0
amp_C = 0.0

show_stats = no
write_vtk = no
