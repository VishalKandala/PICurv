# ===================================================================
# Bent channel, coarse: a unit square duct through a 90-degree bend.
#
#   i (Xi)   : cross-section, wall-normal
#   j (Eta)  : cross-section, wall-normal
#   k (Zeta) : along the centreline
#
# This replaces a 2.9 MB `.picgrid` that used to ship inside the example.
# It reproduces that file to 5e-8, which is the precision the file itself
# was written at (`%.8e`); the generator now writes round-trip-safe
# `%.17e`, so the generated grid is strictly the better artifact.
#
# Centreline: 5 in, a quarter turn on radius 4, 5 out. Total arc length
# 2*5 + 4*pi/2 = 16.2832, over 144 cells.
#
# Uniform spacing throughout. This case is a particle-transport and
# search-robustness workhorse rather than a wall-resolved one, so there is
# no near-wall clustering to preserve; add `first_cell_i_*`/`first_cell_j_*`
# if that changes, remembering they are fractions of the side length.
# ===================================================================

[sweep]
# --- Discretization ---
ncells_i = 20
ncells_j = 20
ncells_k = 144

# --- Cross-section ---
cross_section = rectangle
side_lengths  = 1.0 1.0

# --- Centreline ---
path = straight:len=5.0 arc:radius=4.0,deg=90 straight:len=5.0

# --- Placement ---
# Puts the bounding-box minimum corner here, which reproduces the extents the
# shipped grid had: x in [5, 14.5], y in [0.5, 10], z in [0.5, 1.5].
origin = 5.0 0.5 0.5

# --- Outputs ---
show_stats = yes
write_vtk  = no
