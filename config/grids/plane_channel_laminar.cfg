# ===================================================================
# Plane channel, laminar verification grid (Part B.4.1)
#
# A Cartesian box: grid type `box` with no wall shaping and no warp
# amplitudes (amp_A = amp_B = amp_C = 0), so the block stays exactly
# Cartesian while still giving access to the shared stretching controls.
#
#   i (Xi)   : spanwise,     periodic
#   j (Eta)  : wall-normal,  no-slip walls at y = 0 and y = 2
#   k (Zeta) : streamwise,   periodic and driven
#
# The half-height is h = 1 (walls at y = 0, 2; centreline at y = 1), so
# the exact steady solution for an applied body force f and kinematic
# viscosity nu is
#     u(y) = (f / 2nu) * (h^2 - (y-1)^2),   U_b = f h^2 / 3nu.
#
# Deliberately uniform in j: the parabola order-of-accuracy check under
# refinement is cleanest on a uniform wall-normal mesh.
# ===================================================================

[box]
# --- Discretization ---
# Node counts (cells + 1) must stay ODD at every multigrid level: the solver
# coarsens nodes as IM -> (IM+1)/2 and logs "can't be consistently coarsened
# further" on an even count. L levels need a cell count divisible by 2^(L-1);
# mg_levels below makes the generator refuse one that is not.
#   16 cells = 17 nodes -> 9 -> 5   (3 levels)
#   32 cells = 33 nodes -> 17 -> 9  (3 levels)
mg_levels = 3
ncells_i = 16
ncells_j = 32
ncells_k = 16

# --- Geometry ---
bounds_x = 0.0 1.0
bounds_y = 0.0 2.0
bounds_z = 0.0 1.0
origin = 0.0 0.0 0.0

# No wall shaping and no warp amplitudes: an exactly Cartesian block.

# --- Outputs ---
show_stats = yes
write_vtk = no
