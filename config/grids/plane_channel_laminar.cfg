# ===================================================================
# Plane channel, laminar verification grid (Part B.4.1)
#
# A Cartesian box: grid type `warp` with amp_A = amp_B = amp_C = 0
# reduces the warping map to the identity, so the block stays exactly
# Cartesian while still giving access to the shared stretching controls.
#
#   i (Xi)   : spanwise,     periodic
#   j (Eta)  : wall-normal,  no-slip walls at y = 0 and y = 2
#   k (Zeta) : streamwise,   periodic and driven
#
# The half-height is h = 1 (walls at y = 0, 2; centreline at y = 1), so
# the exact steady solution for an applied body force f and kinematic
# viscosity nu is
#     u(y) = (f / 2nu) * (h^2 - (y-1)^2),   U_b = f h^2 / 3nu.
#
# Deliberately uniform in j: the parabola order-of-accuracy check under
# refinement is cleanest on a uniform wall-normal mesh.
# ===================================================================

[warp]
# --- Discretization ---
# Cell counts must stay ODD at every multigrid level: each level coarsens
# as IM -> (IM+1)/2, so an even count coarsens inexactly and the runtime
# logs "can't be consistently coarsened further".
#   17 -> 9 -> 5   (3 levels)
#   33 -> 17 -> 9  (3 levels)
ncells_i = 17
ncells_j = 33
ncells_k = 17

# --- Geometry ---
bounds_x = 0.0 1.0
bounds_y = 0.0 2.0
bounds_z = 0.0 1.0
origin = 0.0 0.0 0.0

# Zero amplitudes => identity warp => exactly Cartesian.
amp_A = 0.0
amp_B = 0.0
amp_C = 0.0

# --- Outputs ---
show_stats = yes
write_vtk = no
