# ===================================================================
# Temporal mixing layer of Colucci et al. (1998), 2D: 4 x 48 x 36 cells.
#
#   i : the thin 2D direction, periodic, 4 cells   x in [0, 4*Delta]
#   j : cross-stream, free-slip walls, 48 cells    y in [-Ly/2 + Delta/2, Ly/2 + Delta/2]
#   k : streamwise, periodic, 36 cells             z in [0, Lx]
#
# Lengths are in units of L_r, with delta_v0 / L_r = 2.83. The streamwise length is two
# wavelengths of the most unstable mode of U = tanh(y/delta), delta = delta_v0/2:
# Lx = 2 * 2 pi delta / 0.44486 = 39.9708. The paper's LES grid, 37 x 49 points with
# equal spacing, fixes Delta = Lx/36 = 1.11030 and Ly = 48 Delta = 53.2944.
#
# Every axis is uniform: the cell is the particle ensemble, and the IEM mixing frequency
# reads Delta from the cell volume, so the four i cells are cubic like the in-plane ones.
# The i axis is not coarsened by multigrid (semi_coarsening i in the solver profiles);
# j and k take three levels (48 -> 24 -> 12, 36 -> 18 -> 9).
# ===================================================================

[box]
# --- Discretization ---
ncells_i = 4
ncells_j = 48
ncells_k = 36

# --- Geometry ---
bounds_x = 0.0 4.441201081818058
bounds_y = 0.0 53.29441298181669
bounds_z = 0.0 39.97080973636252
# The box spans bounds from origin. It is shifted up by Delta/2 so that a cell centre, not a
# face, lies on the layer centre y = 0: the paper's grid has a point there, and the vorticity
# thickness is read from the maximum of the cell-centred gradient, which peaks at y = 0. With a
# face there it would read 3.70 at t = 0 instead of the paper's 3.38. The walls sit at -26.09
# and +27.20, both more than 18 layer half-widths from the layer.
origin   = 0.0 -26.092056355681088 0.0

# --- Periodicity ---
periodic = i k

# --- Outputs ---
show_stats = no
write_vtk  = no
