# ===================================================================
# Humphrey, Whitelaw & Yee (1981), JFM 103, 443: turbulent flow through a
# 90-degree square-duct bend, Re_D = U_b D / nu = 40,000. Wall-modelled rung.
#
# Lengths are in duct side lengths D (the case's length_ref). The experiment's
# D = 40 mm and bend radius Rc = 92 mm give Rc/D = 2.3, measured to the
# centreline.
#
#   i (Xi)   : cross-section; the bend turns in the i-k plane, so i runs from
#              the inner (convex) wall to the outer (concave) wall
#   j (Eta)  : cross-section, spanwise; j = 0 and j = 1 are the flat side walls
#   k (Zeta) : along the centreline, inlet at k = 0
#
# Straight lengths are choices, not experimental stations. The inlet carries a
# mapped mean profile from a precursor duct (no turbulent inflow exists), so it
# is short; the outlet must clear the downstream measurement stations and the
# outlet boundary's upstream influence, so it is long.
#
# Uniform cross-section, sized for a wall function: at u_tau = 0.0529 U_b
# (Blasius at Re_D = 40,000) one wall unit is 4.73e-4 D, and 32 cells put the
# first cell centre at y+ ~ 33, just inside the log layer. The .info report
# states the realized value under [Wall Units - nominal]. Streamwise spacing is
# ~0.053 D (~112 wall units). 32 x 32 x 256 = 262k cells; the node counts
# (33, 33, 257) coarsen exactly through four multigrid levels, and mg_levels
# makes the generator refuse a count that cannot.
# ===================================================================

[sweep]
ncells_i = 32
ncells_j = 32
ncells_k = 256

cross_section = rectangle
side_lengths  = 1.0 1.0

# Inlet 3 D, bend arc length (pi/2)(2.3) = 3.61 D, outlet 7 D.
path = straight:len=3.0 arc:radius=2.3,deg=90 straight:len=7.0

# Design friction velocity for the nominal wall-unit report; nu and length_ref
# come from the case when picurv drives the generator.
u_tau = 0.0529

mg_levels = 4

show_stats = yes
write_vtk  = no
