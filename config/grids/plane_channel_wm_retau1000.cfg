# ===================================================================
# Plane channel for wall-modelled LES, Re_tau ~ 1000 (Dean's correlation at
# Re_b = 2 U_b delta / nu = 40,000).
#
#   i (Xi)   : spanwise,     periodic          x in [0, pi]
#   j (Eta)  : wall-normal,  wall-modelled     y in [0, 2]   (half-height h = 1)
#   k (Zeta) : streamwise,   periodic, driven  z in [0, 2*pi]
#
# UNIFORM IN ALL THREE DIRECTIONS. A wall model replaces the resolved near-wall
# layer, so its first cell belongs in the logarithmic region, not packed against
# the wall. 20 wall-normal cells put the first cell centre at y+ ~ 51 at
# Re_tau = 1016; dx+ ~ 100 spanwise and dz+ ~ 133 streamwise. Run the generator
# with --re-tau 1016 (or let picurv pass length_ref and nu) to see the nominal
# values in the .info report.
#
# Node counts (cells + 1) must stay odd at every multigrid level: 33, 21 and 49
# nodes coarsen exactly through three levels (coarse grid 9 x 6 x 13 = 702).
# ===================================================================

[box]
mg_levels = 3
ncells_i = 32
ncells_j = 20
ncells_k = 48

bounds_x = 0.0 3.141592653589793
bounds_y = 0.0 2.0
bounds_z = 0.0 6.283185307179586
origin = 0.0 0.0 0.0

show_stats = yes
write_vtk = no
