# ===================================================================
# Plane channel DNS grid, Re_tau = 395 (Part B.4.2)
#
# Cartesian box (grid type `warp` with amp_A = amp_B = amp_C = 0, which
# reduces the warping map to the identity) with two-sided tanh wall
# clustering in the wall-normal direction.
#
#   i (Xi)   : spanwise,     periodic          x in [0, 3.141592653589793]
#   j (Eta)  : wall-normal,  no-slip walls     y in [0, 2]   (half-height h = 1)
#   k (Zeta) : streamwise,   periodic, driven  z in [0, 6.283185307179586]
#
# WALL SPACING IS THE TUNING KNOB. `first_cell_j_start`/`_end` are given
# as a FRACTION OF THE AXIS LENGTH, not in physical units, so for the
# wall-normal axis of length Ly = 2:
#
#     first_cell_j = (y_plus_target / Re_tau) / Ly
#
# Shipped value targets y+_1 = 0.5 at Re_tau = 395: (0.5/395)/2 = 6.329114e-04.
# Resolution in wall units: dx+ (spanwise) = 9.6, dz+ (streamwise) = 9.7.
# Domain follows Moser, Kim & Mansour (1999): 2*pi*delta x 2*delta x pi*delta.
# Retarget y+ by editing these two numbers alone; nothing else in the
# case needs to change.
#
# `stretch_j` is only the initial guess for the tanh fit. The generator
# solves for the factor that actually realizes the requested first cell
# and reports it as "Computed stretch factor".
# ===================================================================

[warp]
# --- Discretization ---
# Cell counts must stay ODD at every multigrid level: each level coarsens
# as IM -> (IM+1)/2. 129 -> 65 -> 33 -> 17 -> 9 and 257 -> 129 -> 65 -> 33 -> 17 support 5 levels
# (coarse grid 9x17x17 = 2601).
ncells_i = 129
ncells_j = 257
ncells_k = 257

# --- Wall-normal clustering (two-sided: both walls) ---
stretch_j = 2.0
first_cell_j_start = 6.329114e-04
first_cell_j_end = 6.329114e-04

# --- Geometry ---
bounds_x = 0.0 3.141592653589793
bounds_y = 0.0 2.0
bounds_z = 0.0 6.283185307179586
origin = 0.0 0.0 0.0

# Zero amplitudes => identity warp => exactly Cartesian.
amp_A = 0.0
amp_B = 0.0
amp_C = 0.0

# --- Outputs ---
show_stats = yes
write_vtk = no
