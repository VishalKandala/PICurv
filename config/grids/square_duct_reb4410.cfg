# ===================================================================
# Square duct DNS grid, Re_b = 4410 (Part B.4.3)
#
# Cartesian box (grid type `warp` with amp_A = amp_B = amp_C = 0, which
# reduces the warping map to the identity) with two-sided tanh wall
# clustering on BOTH cross-stream directions, since a duct has four walls.
#
#   i (Xi)   : cross-stream, no-slip walls     x in [0, 2]
#   j (Eta)  : cross-stream, no-slip walls     y in [0, 2]
#   k (Zeta) : streamwise,   periodic, driven  z in [0, 4*pi]
#
# The duct half-width is a = 1, so the side length (and hydraulic
# diameter) is D = 2a = 2. With U_b = 1 the case Reynolds number is
# Re = U_b a / nu, and the literature bulk Reynolds number is
# Re_b = U_b D / nu = 2 * Re.
#
# References:
#   Gavrilakis (1992), JFM 244, 101   -- Re_b = 4410, Re_tau ~ 300
#   Huser & Biringen (1993), JFM 257, 65 -- Re_tau ~ 600
#
# WALL SPACING IS THE TUNING KNOB. `first_cell_i_*`/`first_cell_j_*` are
# given as a FRACTION OF THE AXIS LENGTH, not in physical units, so for
# cross-stream axes of length 2:
#
#     first_cell = (y_plus_target / Re_tau) / 2
#
# Shipped value targets y+_1 = 0.5 at Re_tau = 300: (0.5/300)/2 = 8.333333e-04.
# Retarget y+ by editing these four numbers alone; nothing else in the
# case needs to change. Both cross-stream directions are clustered
# identically, which keeps the corner region symmetric - important,
# because the corner is where the secondary flow of the second kind lives.
# ===================================================================

[warp]
# --- Discretization ---
# Cell counts must stay ODD at every multigrid level: each level coarsens
# as IM -> (IM+1)/2. 129 -> 65 -> 33 -> 17 -> 9 and
# 257 -> 129 -> 65 -> 33 -> 17 support 5 levels (coarse grid 9x9x17 = 1377).
ncells_i = 129
ncells_j = 129
ncells_k = 257

# --- Cross-stream clustering (two-sided on both walled directions) ---
stretch_i = 2.0
first_cell_i_start = 8.333333e-04
first_cell_i_end = 8.333333e-04
stretch_j = 2.0
first_cell_j_start = 8.333333e-04
first_cell_j_end = 8.333333e-04

# --- Geometry ---
bounds_x = 0.0 2.0
bounds_y = 0.0 2.0
bounds_z = 0.0 12.566370614359172
origin = 0.0 0.0 0.0

# Zero amplitudes => identity warp => exactly Cartesian.
amp_A = 0.0
amp_B = 0.0
amp_C = 0.0

# --- Outputs ---
show_stats = yes
write_vtk = no
