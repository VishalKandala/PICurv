# ===================================================================
# Periodic cube for decaying isotropic turbulence, 64^3 cells.
#
#   i, j, k : all periodic, all uniform      x, y, z in [0, 2*pi]
#
# Uniform spacing on every axis is a requirement, not a preference: the
# shell-spectrum post-processor refuses stretched or curvilinear grids, so
# any clustering here would silently disable the analysis this case exists
# to produce. Leave the stretching controls alone.
#
# 64 cells gives 65 nodes, which is 2^6 + 1 and so coarsens cleanly for up
# to 7 multigrid levels (65 -> 33 -> 17 -> 9 -> 5 -> 3 -> 2). Declare the
# level count with `mg_levels` if the solver profile uses one, and the
# generator will refuse a count that cannot coarsen that far.
# ===================================================================

[box]
# --- Discretization ---
ncells_i = 64
ncells_j = 64
ncells_k = 64

# --- Geometry ---
# A 2*pi cube: the box the spectral initial condition is written on.
bounds_x = 0.0 6.283185307179586
bounds_y = 0.0 6.283185307179586
bounds_z = 0.0 6.283185307179586
origin   = 0.0 0.0 0.0

# --- Periodicity ---
# Declaring the axes periodic makes the generator reject anything that would
# put a discontinuity on a seam, such as one-sided stretching or a rotation.
periodic = i j k

# --- Outputs ---
show_stats = no
write_vtk  = no
