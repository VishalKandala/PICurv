# ===================================================================
# Curved square tube: a square cross-section swept through a 90-degree bend.
#
#   i (Xi)   : cross-section, wall-normal
#   j (Eta)  : cross-section, wall-normal
#   k (Zeta) : along the centreline
#
# The centreline is a segment list, so the same config becomes a straight
# duct, a U-bend or an S-bend by editing one line:
#
#   straight duct : straight:len=15
#   U-bend        : straight:len=5 arc:radius=2.3,deg=180 straight:len=5
#   S-bend        : straight:len=5 arc:radius=2.3,deg=90 arc:radius=2.3,deg=-90 straight:len=5
#
# An `arc` turns in the plane perpendicular to its axis (default z). It may
# not turn about an axis parallel to the current tangent, because an arc has
# no defined plane there; chain arcs about different axes to leave a plane.
# ===================================================================

[sweep]
# --- Discretization ---
ncells_i = 64
ncells_j = 64
ncells_k = 280

# --- Cross-section ---
# `rectangle` takes the two full side lengths. `circle` takes two diameters and
# uses the square-to-disc map: one block, no pinhole, no axis singularity, but
# cell size varies with angle and is worst in the four diagonal regions.
cross_section = rectangle
side_lengths  = 1.0 1.0

# --- Centreline ---
path = straight:len=5.0 arc:radius=2.3,deg=90 straight:len=5.0

# --- Wall clustering ---
# Both cross-section directions are walls, so both are clustered from both ends.
# `first_cell_*` is a fraction of the axis length, not a physical length.
stretch_i          = 1.1
stretch_j          = 1.1
first_cell_i_start = 0.01
first_cell_i_end   = 0.01
first_cell_j_start = 0.01
first_cell_j_end   = 0.01

# --- Placement ---
# `origin` puts the bounding-box minimum corner here. `transforms` composes on
# top of that; see 48_Grid_Generator_Guide for the full operation list.
origin = 5.0 0.5 0.5

# --- Outputs ---
show_stats = yes
write_vtk  = no
