# Newton--Krylov profile using the provisional frozen-momentum point-block preconditioner.
# Validated for the same periodic-flow scope as Newton-Krylov-Standard.yml.
operation_mode:
  eulerian_field_source: "solve"

strategy:
  momentum_solver: "Newton Krylov"
  central_diff: true

tolerances:
  max_iterations: 25
  relative_tol: 1.0e-8
  residual_absolute_tol: 1.0e-8   # dimensionless: |R| <= this * a0*|Ucont|_inf/dt
  residual_relative_tol: 1.0e-6

momentum_solver:
  newton_krylov:
    jacobian:
      type: "finite_difference"
      finite_difference:
        mode: "matrix_free"
    preconditioner:
      model: "frozen_momentum_jacobian"
      structure:
        type: "point_block"
    nonlinear_solver:
      method: "newtonls"
      absolute_tolerance: 1.0e-10
      relative_tolerance: 1.0e-8
      step_tolerance: 1.0e-12
      max_iterations: 25
      line_search:
        type: "bt"
    linear_solver:
      method: "gmres"
      absolute_tolerance: 1.0e-10
      relative_tolerance: 1.0e-6
      max_iterations: 400
      gmres:
        restart: 80

poisson_solver:
  method: "fgmres"
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-11
  max_iterations: 100
  gmres:
    restart: 30
  preconditioner:
    type: "multigrid"
  multigrid:
    levels: 4
    pre_sweeps: 2
    post_sweeps: 2
    cycle: "v"
    mode: "multiplicative"
    semi_coarsening:
      i: false
      j: false
      k: false
    level_solvers:
      # level_0 is the coarse SOLVE, not a smoother: it must be a fixed linear
      # operator. See docs/pages/25_Pressure_Poisson_GMRES_Multigrid.md.
      level_0: {method: "preonly", preconditioner: "redundant"}
      level_1: {method: "richardson", preconditioner: "bjacobi"}
      level_2: {method: "richardson", preconditioner: "bjacobi"}
      level_3: {method: "richardson", preconditioner: "bjacobi"}

petsc_passthrough_options: {}
