# ==============================================================================
#   Post-processing profile for the driven periodic validation cases
# ==============================================================================
# Produces nodal Ucat and P for visual inspection, and the stationary window's
# statistics merged over the spanwise (i) and streamwise (k) directions, leaving
# a wall-normal profile, which the wall_profile reducer folds and writes in wall
# units for the DNS comparison.
# ==============================================================================

run_control:
  start_step: 0
  end_step: 50000
  step_interval: 5000

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: nodal_average
    input_field: "Ucat"
    output_field: "Ucat_nodal"
  - task: nodal_average
    input_field: "P"
    output_field: "P_nodal"

field_statistics:
  windows: [stationary]
  homogeneous: [i, k]
  outputs: [mean, reynolds_stress]
  formats: [csv]

reducers:
  tasks:
    - task: wall_profile
      source: stationary
      friction_velocity: wall_model

io:
  output_filename_prefix: "driven_channel_les_wallmodel_retau1000"
  eulerian_fields:
    - "Ucat_nodal"
    - "P_nodal"
  output_particles: false
  input_extensions:
    eulerian: "dat"
    particle: "dat"
