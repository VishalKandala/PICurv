# ==============================================================================
#   Post-processing profile for the driven periodic validation cases
# ==============================================================================
# Produces nodal Ucat and P for visual inspection, and the stationary window's
# statistics merged over the spanwise (i) and streamwise (k) directions, leaving
# a wall-normal profile. The DNS comparison is done by
# tools/wall_normal_profile.py, which reads that profile
# (<analysis statistics>/<recipe>/<prefix>_profile_stationary_<step>.csv). The
# reduction is in solver units only because this case's reference scales are 1.
# ==============================================================================

run_control:
  start_step: 0
  end_step: 400000
  step_interval: 40000

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: nodal_average
    input_field: "Ucat"
    output_field: "Ucat_nodal"
  - task: nodal_average
    input_field: "P"
    output_field: "P_nodal"

field_statistics:
  windows: [stationary]
  homogeneous: [i, k]
  outputs: [mean, reynolds_stress]
  formats: [csv]

io:
  output_directory: "visualization/driven_channel_retau395"
  output_filename_prefix: "driven_channel_retau395"
  eulerian_fields:
    - "Ucat_nodal"
    - "P_nodal"
  output_particles: false
  input_extensions:
    eulerian: "dat"
    particle: "dat"
