# ==============================================================================
#   Driven periodic plane channel - TURBULENT DNS, Re_tau = 180 (Part B.4.2)
#   Handler: initial_flux
# ==============================================================================
# DNS resolution, no SGS model, so any error in the flux controller is not
# conflated with an SGS-model error. Domain 4*pi*delta (streamwise) x
# 2*delta (wall-normal) x 2*pi*delta (spanwise) on 128^3 cells.
#
# Reference: Moser, Kim & Mansour (1999), Phys. Fluids 11, 943.
#
# Acceptance:
#   - mean profile in wall units (U+ vs y+) against the log law and the DNS
#   - RMS fluctuation profiles u'+, v'+, w'+
#   - realized u_tau = sqrt(f h); here the target is u_tau = 180 * nu = 6.4286e-02
#     and hence f = u_tau^2 / h = 4.1327e-03
#
# COST: this is a campaign case, not a smoke test. See driven_channel.md.
#
# SEEDING: channel_spectral_velocity, a finite-amplitude perturbation. Transition
# from it is still not guaranteed; watch fluctuation energy and Reynolds shear
# stress. See driven_channel.md section 6.
# ==============================================================================

run_control:
  start_step: 0
  total_steps: 200000
  dt_physical: 0.005

properties:
  scaling:
    length_ref: 1.0     # channel half-height delta
    velocity_ref: 1.0   # target bulk velocity U_b
  fluid:
    density: 1.0
    viscosity: 3.5714286e-04  # -> Re = 2800 = U_b * delta / nu
  initial_conditions:
    # Divergence-free wall-respecting perturbation (RMS 0.1 U_b) on a parabolic mean
    # normalized to U_b. k_cut must stay below two-thirds of the coarsest periodic
    # axis's Nyquist wavenumber. Initial plane spectra record the seed at
    # wall-normal cells 8, 32, 64 (zero-based).
    mode: generated
    generator: channel_spectral_velocity
    params:
      field: Ucat
      seed: 12345
      wall_axes: [j]
      streamwise_axis: k
      bulk_velocity: 1.0
      perturbation_rms: 0.1
      wall_modes: 3
      spectrum: {type: k4_exponential, k0: 4.0, k_cut: 8.0}
      initial_spectra:
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 8}, subtract_mean: sample}
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 32}, subtract_mean: sample}
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 64}, subtract_mean: sample}

grid:
  mode: grid_gen
  generator:
    config_file: "../../../../config/grids/plane_channel_retau180.cfg"
    grid_type: box

models:
  physics:
    particles:
      count: 0
    turbulence:
      les:
        enabled: false

boundary_conditions:
  # i (Xi): spanwise, plain periodic.
  - face: "-Xi"
    type: PERIODIC
    handler: geometric
  - face: "+Xi"
    type: PERIODIC
    handler: geometric
  # j (Eta): wall-normal, no-slip walls.
  - face: "-Eta"
    type: WALL
    handler: noslip
  - face: "+Eta"
    type: WALL
    handler: noslip
  # k (Zeta): streamwise, periodic and DRIVEN.
  - face: "-Zeta"
    type: PERIODIC
    handler: initial_flux
    # No target_flux: this handler measures the volumetric flux of the
    # initial condition and holds it, which for this case is 12.566370614359172   # U_b * Lz_span * Ly = 1.0 * 2*pi * 2.0 = 4*pi.
  - face: "+Zeta"
    type: PERIODIC
    handler: initial_flux
