# ==============================================================================
#   Matrix-free Newton--Krylov momentum + geometric multigrid Poisson (Part C)
# ==============================================================================
# 129^3 cells (2.15M); 5 levels leave a 9x9x9 = 729 unknown coarse grid.
#
# Both driven periodic handlers are inside the validated Newton--Krylov boundary
# scope: their PreStep freezes the momentum source once per physical timestep, so
# the source does not drift between residual evaluations. See
# docs/pages/55_Newton_Krylov_Momentum_Solver.md.
# ==============================================================================

operation_mode:
  eulerian_field_source: "solve"

strategy:
  momentum_solver: "Newton Krylov"
  central_diff: true

tolerances:
  max_iterations: 25
  absolute_tol: 1.0e-10
  relative_tol: 1.0e-8
  residual_absolute_tol: 0.0
  residual_relative_tol: 1.0e-6

momentum_solver:
  newton_krylov:
    jacobian:
      type: "finite_difference"
      finite_difference:
        mode: "matrix_free"
    preconditioner:
      model: "none"
    nonlinear_solver:
      method: "newtonls"
      absolute_tolerance: 1.0e-10
      relative_tolerance: 1.0e-8
      step_tolerance: 1.0e-12
      max_iterations: 25
      line_search:
        type: "bt"
    linear_solver:
      method: "gmres"
      absolute_tolerance: 1.0e-10
      relative_tolerance: 1.0e-6
      max_iterations: 400
      gmres:
        restart: 80

poisson_solver:
  method: "fgmres"
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-11
  max_iterations: 100
  gmres:
    restart: 30
  preconditioner:
    type: "multigrid"
  multigrid:
    levels: 5
    pre_sweeps: 2
    post_sweeps: 2
    cycle: "v"
    mode: "multiplicative"
    semi_coarsening:
      i: false
      j: false
      k: false
    level_solvers:
      level_0:
        # Coarse SOLVE, not a smoother: it must be a fixed linear operator.
        # See docs/pages/25_Pressure_Poisson_GMRES_Multigrid.md.
        method: "preonly"
        preconditioner: "redundant"
      level_1:
        method: "richardson"
        preconditioner: "bjacobi"
      level_2:
        method: "richardson"
        preconditioner: "bjacobi"
      level_3:
        method: "richardson"
        preconditioner: "bjacobi"
      level_4:
        method: "richardson"
        preconditioner: "bjacobi"

petsc_passthrough_options: {}
