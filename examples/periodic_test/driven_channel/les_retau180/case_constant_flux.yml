# ==============================================================================
#   Driven periodic plane channel - LES, Re_tau = 180 (Part B.4.2, coarse pass)
#   Handler: constant_flux
# ==============================================================================
# The coarse-resolution repeat of turbulent_retau180 with constant
# Smagorinsky, run after the DNS pass so the SGS contribution is assessed
# against an in-tree DNS rather than against literature alone.
#
# Same domain and Reynolds number as turbulent_retau180, on 32 x 64 x 32
# cells (dx+ = 35, dz+ = 71, y+_1 = 1).
# ==============================================================================

run_control:
  start_step: 0
  total_steps: 60000
  dt_physical: 0.01

properties:
  scaling:
    length_ref: 1.0     # channel half-height delta
    velocity_ref: 1.0   # target bulk velocity U_b
  fluid:
    density: 1.0
    viscosity: 3.5714286e-04  # -> Re = 2800 = U_b * delta / nu
  initial_conditions:
    # Divergence-free wall-respecting perturbation (RMS 0.1 U_b) on a parabolic mean
    # normalized to U_b. k_cut must stay below two-thirds of the coarsest periodic
    # axis's Nyquist wavenumber. Initial plane spectra record the seed at
    # wall-normal cells 4, 16, 32 (zero-based).
    mode: generated
    generator: channel_spectral_velocity
    params:
      field: Ucat
      seed: 12345
      wall_axes: [j]
      streamwise_axis: k
      bulk_velocity: 1.0
      perturbation_rms: 0.1
      wall_modes: 3
      spectrum: {type: k4_exponential, k0: 2.0, k_cut: 5.0}
      initial_spectra:
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 4}, subtract_mean: sample}
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 16}, subtract_mean: sample}
        - {task: plane_spectrum, axes: [i, k], fixed_indices: {j: 32}, subtract_mean: sample}

grid:
  mode: grid_gen
  generator:
    config_file: "../../../../config/grids/plane_channel_les_retau180.cfg"
    grid_type: box

models:
  physics:
    particles:
      count: 0
    turbulence:
      # All four LES models are experimental: implemented and unit-tested, but with
      # no validated coefficient magnitude. The constant model applies constant_cs from
      # the first step and allocates no coefficient field.
      #
      # The channel is periodic in xi and zeta, so dynamic_smagorinsky with
      # averaging.mode: homogeneous derives those directions from the boundary pairs
      # and produces a wall-normal Cs profile instead of a single constant. That is
      # the physically better choice here; it is not selected by default because this
      # case exists to assess the SGS contribution against an in-tree DNS with the
      # simplest closure first.
      les:
        enabled: true
        model: "constant_smagorinsky"
        constant_cs: 0.03

boundary_conditions:
  # i (Xi): spanwise, plain periodic.
  - face: "-Xi"
    type: PERIODIC
    handler: geometric
  - face: "+Xi"
    type: PERIODIC
    handler: geometric
  # j (Eta): wall-normal, no-slip walls.
  - face: "-Eta"
    type: WALL
    handler: noslip
  - face: "+Eta"
    type: WALL
    handler: noslip
  # k (Zeta): streamwise, periodic and DRIVEN.
  - face: "-Zeta"
    type: PERIODIC
    handler: constant_flux
    params:
      target_flux: 12.566370614359172   # U_b * Lz_span * Ly = 1.0 * 2*pi * 2.0 = 4*pi
  - face: "+Zeta"
    type: PERIODIC
    handler: constant_flux
    params:
      target_flux: 12.566370614359172   # U_b * Lz_span * Ly = 1.0 * 2*pi * 2.0 = 4*pi
