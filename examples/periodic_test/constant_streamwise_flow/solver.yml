# Numerical profile for the serial constant-uniform-flow periodic smoke test.

operation_mode:
  eulerian_field_source: "solve"

strategy:
  momentum_solver: "Dual Time Picard Jameson RK"
  central_diff: false

tolerances:
  max_iterations: 20
  relative_tol: 1.0e-8
  residual_absolute_tol: 1.0e-8   # dimensionless: |R| <= this * a0*|Ucont|_inf/dt
  residual_relative_tol: 1.0e-6

momentum_solver:
  dual_time_picard_jameson_rk:
    max_pseudo_steps: 20
    relative_tol: 1.0e-8
    pseudo_cfl:
      initial: 0.5   # dimensionless Courant number: cfl_eff = dtau * lambda_max; stable range ~0-2.83
      minimum: 0.001
      maximum: 2.0   # 4-stage Jameson RK stability limit is ~2.83; 2.0 gives a comfortable margin
      growth_factor: 1.1
      reduction_factor: 0.75

poisson_solver:
  method: "fgmres"
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-12
  max_iterations: 50
  gmres:
    restart: 20
  preconditioner:
    type: "multigrid"
  multigrid:
    levels: 2
    pre_sweeps: 2
    post_sweeps: 2
    cycle: "v"
    mode: "multiplicative"
    semi_coarsening:
      i: false
      j: false
      k: false
    level_solvers:
      level_0:
        # Coarsest level. This is the coarse SOLVE at the base of the V-cycle,
        # not a smoother, so it must be a FIXED LINEAR operator. A Krylov
        # method here makes the multigrid preconditioner nonlinear and
        # decouples the outer FGMRES tracked residual from the true residual.
        # See docs/pages/25_Pressure_Poisson_GMRES_Multigrid.md.
        method: "preonly"           # -> -ps_mg_coarse_ksp_type
        preconditioner: "redundant" # -> -ps_mg_coarse_pc_type (replicated LU)
      level_1:
        method: "richardson"
        preconditioner: "bjacobi"

petsc_passthrough_options: {}
