# ==============================================================================
#   Driven periodic SQUARE DUCT - TURBULENT DNS, Re_b = 4410 (Part B.4.3)
#   Handler: initial_flux
# ==============================================================================
# A square duct sustains turbulence-driven secondary flow of the second
# kind, which a plane channel does not. That makes it the case that
# exercises the driven-flow machinery in a genuinely three-dimensional
# mean field.
#
# Duct half-width a = 1, so side length and hydraulic diameter D = 2a = 2.
# Streamwise extent 4*pi*a. Cross-section resolved 128 x 128 with two-sided
# clustering on both walled directions; 256 cells streamwise.
#
# References:
#   Gavrilakis (1992), JFM 244, 101      -- Re_b = 4410, Re_tau ~ 300
#   Huser & Biringen (1993), JFM 257, 65 -- Re_tau ~ 600
#
# Acceptance:
#   - mean streamwise profile along the wall bisector and the corner bisector
#   - presence and magnitude of the cross-plane secondary flow, 1-3% of U_b
#   - wall shear stress distribution along a wall
#
# NOTE ON Re: the case Reynolds number below is U_b * a / nu = 2205. The
# literature value Re_b = U_b * D / nu is twice that, 4410.
#
# SEEDING: duct_spectral_velocity. Transition from it is not guaranteed; see
# driven_duct.md section 6.
# ==============================================================================

run_control:
  start_step: 0
  total_steps: 300000
  dt_physical: 0.005

properties:
  scaling:
    length_ref: 1.0     # duct half-width a
    velocity_ref: 1.0   # target bulk velocity U_b
  fluid:
    density: 1.0
    viscosity: 4.5351474e-04  # -> Re = 2205 = U_b * a / nu (literature Re_b = U_b * D / nu = 4410)
  initial_conditions:
    # Divergence-free wall-respecting perturbation (RMS 0.1 U_b) on a flux-normalized
    # product-parabola mean. k_cut stays below two-thirds of the streamwise Nyquist
    # wavenumber (42.7). The initial line spectrum samples the duct centreline.
    mode: generated
    generator: duct_spectral_velocity
    params:
      field: Ucat
      seed: 12345
      wall_axes: [i, j]
      streamwise_axis: k
      bulk_velocity: 1.0
      perturbation_rms: 0.1
      wall_modes: 3
      spectrum: {type: k4_exponential, k0: 4.0, k_cut: 8.0}
      initial_spectra:
        - {task: line_spectrum, axes: [k], fixed_indices: {i: 64, j: 64}, subtract_mean: sample}

grid:
  mode: grid_gen
  generator:
    config_file: "../../../config/grids/square_duct_reb4410.cfg"
    grid_type: box

models:
  physics:
    particles:
      count: 0
    turbulence:
      les:
        enabled: false

boundary_conditions:
  # i (Xi) and j (Eta): the four duct walls.
  - face: "-Xi"
    type: WALL
    handler: noslip
  - face: "+Xi"
    type: WALL
    handler: noslip
  - face: "-Eta"
    type: WALL
    handler: noslip
  - face: "+Eta"
    type: WALL
    handler: noslip
  # k (Zeta): streamwise, periodic and DRIVEN.
  - face: "-Zeta"
    type: PERIODIC
    handler: initial_flux
    # No target_flux: this handler measures the volumetric flux of the
    # initial condition and holds it, which for this case is 4.0                  # U_b * Lx * Ly = 1.0 * 2.0 * 2.0.
  - face: "+Zeta"
    type: PERIODIC
    handler: initial_flux
