# Seeded square-duct startup; bulk Reynolds number based on side length is 4410.
run_control:
  start_step: 0
  total_steps: 1000
  dt_physical: 0.005
properties:
  scaling:
    length_ref: 1.0
    velocity_ref: 1.0
  fluid:
    density: 1.0
    viscosity: 0.00045351474
  initial_conditions:
    mode: generated
    generator: duct_spectral_velocity
    params:
      seed: 12345
      wall_axes:
      - i
      - j
      streamwise_axis: k
      bulk_velocity: 1.0
      perturbation_rms: 0.1
      wall_modes: 3
      spectrum:
        type: k4_exponential
        k0: 4.0
        k_cut: 8.0
      initial_spectra:
      - task: line_spectrum
        axes:
        - k
        fixed_indices:
          i: 63
          j: 63
        subtract_mean: sample
grid:
  mode: grid_gen
  generator:
    config_file: grid_spectral.cfg
    grid_type: box
models:
  domain:
    blocks: 1
  physics:
    particles:
      count: 0
    turbulence:
      les:
        enabled: false
boundary_conditions:
- face: -Xi
  type: WALL
  handler: noslip
- face: +Xi
  type: WALL
  handler: noslip
- face: -Eta
  type: WALL
  handler: noslip
- face: +Eta
  type: WALL
  handler: noslip
- face: -Zeta
  type: PERIODIC
  handler: constant_flux
  params:
    target_flux: 4.0
- face: +Zeta
  type: PERIODIC
  handler: constant_flux
  params:
    target_flux: 4.0
