# ==============================================================================
#   Post-processing profile for the driven periodic validation cases
# ==============================================================================
# Produces nodal Ucat and P for visual inspection. The quantitative comparison
# against DNS needs the field_statistics window averaged along the one
# homogeneous (streamwise) direction, and neither the postprocessor nor a
# shipped tool does that today: driven_channel/tools/wall_normal_profile.py
# averages over two homogeneous directions and so applies only to the channel.
# ==============================================================================

run_control:
  start_step: 0
  end_step: 300000
  step_interval: 30000

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: nodal_average
    input_field: "Ucat"
    output_field: "Ucat_nodal"
  - task: nodal_average
    input_field: "P"
    output_field: "P_nodal"

io:
  output_directory: "visualization/driven_duct"
  output_filename_prefix: "driven_duct"
  eulerian_fields:
    - "Ucat_nodal"
    - "P_nodal"
  output_particles: false
  input_extensions:
    eulerian: "dat"
    particle: "dat"
