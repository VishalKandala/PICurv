# ==============================================================================
#   Post-processing profile for the driven periodic validation cases
# ==============================================================================
# Produces nodal Ucat and P for visual inspection, and the stationary window's
# statistics merged over the streamwise direction, leaving the cross-section.
# The cross_section reducer reads that profile off against the DNS criteria:
# bisector profiles in wall units, the secondary flow, and the wall shear.
# ==============================================================================

run_control:
  start_step: 0
  end_step: 300000
  step_interval: 30000

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: nodal_average
    input_field: "Ucat"
    output_field: "Ucat_nodal"
  - task: nodal_average
    input_field: "P"
    output_field: "P_nodal"

field_statistics:
  windows: [stationary]
  homogeneous: [k]
  outputs: [mean, reynolds_stress]
  formats: [csv]

reducers:
  tasks:
    - task: cross_section
      source: stationary

io:
  output_filename_prefix: "driven_duct"
  eulerian_fields:
    - "Ucat_nodal"
    - "P_nodal"
  output_particles: false
  input_extensions:
    eulerian: "dat"
    particle: "dat"
