# Statistics window is a configurable placeholder, disabled until stationarity is established.
logging:
  verbosity: INFO
  enabled_functions: []
profiling:
  timestep_output:
    mode: 'off'
  final_summary:
    enabled: true
diagnostics:
  petsc:
    malloc_debug: false
    malloc_test: false
    malloc_dump: false
    malloc_view: false
    malloc_view_threshold: null
    memory_view: false
    log_view: false
    log_view_memory: false
    log_all: false
    log_trace: false
    objects_dump: false
    options_left: null
  runtime_memory_log:
    enabled: true
    file: Runtime_Memory.log
io:
  data_output_frequency: 100
  particle_console_output_frequency: 0
  particle_log_interval: 1
  statistics_console_output_frequency: 100
field_statistics:
  enabled: false
  windows:
  - name: developed
    start_time: 50.0
    end_time: 100.0
    weighting: physical_time
    step_cadence: 5
    fields:
    - field: Ucat
      moments:
      - first
      - second
    - field: P
      moments:
      - first
