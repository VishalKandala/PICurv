# Instantaneous sample spectra during startup; enable developed statistics after equilibration.
run_control:
  start_step: 0
  end_step: 1000
  step_interval: 100
global_operations:
  dimensionalize: true
eulerian_pipeline:
- task: nodal_average
  input_field: P
  output_field: P_nodal
- task: nodal_average
  input_field: Ucat
  output_field: Ucat_nodal
io:
  output_directory: visualization/channel
  output_filename_prefix: channel
  eulerian_fields:
  - Ucat_nodal
  - P_nodal
  output_particles: false
  input_extensions:
    eulerian: dat
    particle: dat
spectra:
  output_prefix: Spectrum
  tasks:
  - task: plane_spectrum
    axes:
    - i
    - k
    fixed_indices:
      j: 8
    subtract_mean: sample
  - task: plane_spectrum
    axes:
    - i
    - k
    fixed_indices:
      j: 32
    subtract_mean: sample
  - task: plane_spectrum
    axes:
    - i
    - k
    fixed_indices:
      j: 63
    subtract_mean: sample
