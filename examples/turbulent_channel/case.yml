# Wall-resolved channel startup, nominal Re_tau ~ 180; see README.md.
run_control:
  start_step: 0
  total_steps: 1000
  dt_physical: 0.005
properties:
  scaling:
    length_ref: 1.0
    velocity_ref: 1.0
  fluid:
    density: 1.0
    viscosity: 0.00035714285714285714
  initial_conditions:
    mode: generated
    generator: channel_spectral_velocity
    params:
      field: Ucat
      seed: 12345
      wall_axes:
      - j
      streamwise_axis: k
      bulk_velocity: 1.0
      perturbation_rms: 0.1
      wall_modes: 3
      spectrum:
        type: k4_exponential
        k0: 4.0
        k_cut: 8.0
      initial_spectra:
      - task: plane_spectrum
        axes:
        - i
        - k
        fixed_indices:
          j: 8
        subtract_mean: sample
      - task: plane_spectrum
        axes:
        - i
        - k
        fixed_indices:
          j: 32
        subtract_mean: sample
      - task: plane_spectrum
        axes:
        - i
        - k
        fixed_indices:
          j: 63
        subtract_mean: sample
grid:
  mode: grid_gen
  generator:
    config_file: grid.cfg
    grid_type: box
models:
  physics:
    dimensionality: 3D
    particles: {count: 0, restart_mode: init}
    turbulence:
      les:
        enabled: false
      rans:
        enabled: false
      wall_function:
        enabled: false
boundary_conditions:
- face: -Xi
  type: PERIODIC
  handler: geometric
- face: +Xi
  type: PERIODIC
  handler: geometric
- face: -Eta
  type: WALL
  handler: noslip
- face: +Eta
  type: WALL
  handler: noslip
- face: -Zeta
  type: PERIODIC
  handler: constant_flux
  params:
    target_flux: 12.566370614359172
- face: +Zeta
  type: PERIODIC
  handler: constant_flux
  params:
    target_flux: 12.566370614359172
