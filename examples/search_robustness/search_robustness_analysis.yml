run_control:
  # Keep the full intended window here. Each post-only run processes only
  # the steps whose output is missing or stale, so `start_step` never needs
  # manual edits.
  start_step: 0
  end_step: 60
  step_interval: 10

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: nodal_average
    input_field: Ucat
    output_field: Ucat_nodal

io:
  output_directory: "viz"
  output_filename_prefix: "Field"
  particle_filename_prefix: "Particle"
  eulerian_fields:
    - Ucat_nodal
  output_particles: true
  particle_fields:
    - 'position'
    - 'pid'
  particle_subsampling_frequency: 1
  input_extensions:
    eulerian: "dat"
    particle: "dat"

statistics_pipeline:
  output_prefix: "SearchRobustness"
  tasks:
    - task: msd
