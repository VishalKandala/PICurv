# QUICKSTART post recipe: targets step 20, matching the quickstart run length.
# The standard recipe targets step 1000 and will skip a shorter run.
# ==========================================================
#         Post-Processing Profile: Standard Analysis
# ==========================================================
# A standard recipe to generate visualization files. It performs
# cell-to-node averaging and calculates Q-criterion.
# ==========================================================

source_data:
  directory: "<solver_output_dir>"

run_control:
  # Every step named here must be one the solver committed a checkpoint at, so the
  # quickstart monitor writes every 10 steps over this 20-step run. The interval
  # is unused for this single-snapshot window but remains a cadence multiple.
  # Analyze only the final timestep:
  start_step: 20
  end_step: 20
  step_interval: 100
  # For a movie over the whole run, use instead:
  #   start_step: 0
  #   end_step: 20
  #   step_interval: 20

global_operations:
  dimensionalize: true

eulerian_pipeline:
  - task: q_criterion
  - task: nodal_average
    input_field: 'Qcrit'
    output_field: 'Qcrit_nodal'

  - task: nodal_average
    input_field: 'P'
    output_field: 'P_nodal'

  - task: nodal_average
    input_field: 'Ucat'
    output_field: 'Ucat_nodal'

  - task: normalize_field
    field: 'P'
    reference_point: [1, 1, 1]

io:
  # Index existing matching ancestor output using checkpoint physical time.
  paraview_series:
    enabled: true
    scope: lineage
  output_directory: "visualization/standard_analysis"
  output_filename_prefix: "eulerian_data"
  particle_filename_prefix: "Particle"

  eulerian_fields:
    - 'Ucat_nodal'
    - 'P_nodal'
    - 'Qcrit_nodal'

  output_particles: false
  particle_fields: []
  particle_subsampling_frequency: 1

  input_extensions:
    eulerian: "dat"
    particle: "dat"
