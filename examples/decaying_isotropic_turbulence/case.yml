run_control:
  start_step: 0
  total_steps: 1000
  dt_physical: 0.002

properties:
  scaling: {length_ref: 1.0, velocity_ref: 1.0}
  fluid: {density: 1.0, viscosity: 0.005}
  initial_conditions:
    mode: generated
    generator: spectral_random_velocity
    params:
      field: Ucat
      seed: 12345
      random:
        distribution: gaussian
        mean: [0.0, 0.0, 0.0]
      spectrum:
        type: k4_exponential
        k0: 4.0
        k_cut: 20.0
      projection:
        type: solenoidal
        operator: picurv_discrete
      normalization:
        type: component_rms
        target: 1.0
      remove_mean: true

grid:
  # The spectral initial condition is a reusable Python asset and therefore
  # needs an inspectable file-backed grid asset, not a grid created later in C.
  mode: grid_gen
  generator:
    config_file: ../../config/grids/coarse_square_tube_curved.cfg
    grid_type: warp
    cli_args:
      - --ncells-i
      - '64'
      - --ncells-j
      - '64'
      - --ncells-k
      - '64'
      - --bounds-x
      - '0.0'
      - '6.283185307179586'
      - --bounds-y
      - '0.0'
      - '6.283185307179586'
      - --bounds-z
      - '0.0'
      - '6.283185307179586'
      - --amp-A
      - '0.0'
      - --amp-B
      - '0.0'
      - --amp-C
      - '0.0'
      - --no-show-stats
      - --no-write-vtk

models:
  domain: {blocks: 1}
  physics:
    dimensionality: 3D
    fsi: {immersed: false, moving_fsi: false}
    particles: {count: 0, restart_mode: init}
    turbulence:
      les:
        enabled: true
        model: dynamic_smagorinsky
        dynamic_frequency: 1
        test_filter:
          kernel: volume_weighted_box
          width_ratio: 2.0
        # The box is homogeneous in all three directions, so the coefficient is one
        # number for the whole domain. This is both the physically correct averaging
        # set and what makes Cs(t) a readable curve instead of a noisy field.
        averaging:
          mode: homogeneous
        clipping:
          mode: clamp
          max_cs: 0.3
        diagnostics:
          enabled: true
          cadence: 1
      rans: {enabled: false}
      wall_function: {enabled: false}

boundary_conditions:
  - {face: "-Xi", type: PERIODIC, handler: geometric}
  - {face: "+Xi", type: PERIODIC, handler: geometric}
  - {face: "-Eta", type: PERIODIC, handler: geometric}
  - {face: "+Eta", type: PERIODIC, handler: geometric}
  - {face: "-Zeta", type: PERIODIC, handler: geometric}
  - {face: "+Zeta", type: PERIODIC, handler: geometric}
