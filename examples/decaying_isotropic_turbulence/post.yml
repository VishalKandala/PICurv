source_data: {directory: "<solver_output_dir>"}
run_control: {start_step: 0, end_step: 1000, step_interval: 50}
global_operations: {dimensionalize: true}
eulerian_pipeline:
  - {task: q_criterion}
  - {task: nodal_average, input_field: P, output_field: P_nodal}
  - {task: nodal_average, input_field: Ucat, output_field: Ucat_nodal}
field_statistics:
  windows: [early_decay, late_decay]
  outputs: [mean, reynolds_stress, rms, tke, flux]
  formats: [vtk, csv]

io:
  output_directory: visualization/dit
  output_filename_prefix: dit
  eulerian_fields: [Ucat_nodal, P_nodal, Qcrit]
  output_particles: false
  input_extensions: {eulerian: dat, particle: dat}
