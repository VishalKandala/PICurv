logging: {verbosity: INFO, enabled_functions: []}
profiling:
  timestep_output: {mode: "off"}
  final_summary: {enabled: true}
diagnostics:
  petsc:
    malloc_debug: false
    malloc_test: false
    malloc_dump: false
    malloc_view: false
    malloc_view_threshold: null
    memory_view: false
    log_view: false
    log_view_memory: false
    log_all: false
    log_trace: false
    objects_dump: false
    options_left: null
  runtime_memory_log: {enabled: true, file: Runtime_Memory.log}
io:
  data_output_frequency: 50
  particle_console_output_frequency: 0
  particle_log_interval: 1
  statistics_console_output_frequency: 50
  directories: {output: output, restart: restart, log: logs}

# Two windows over disjoint stretches of the decay. Isotropy makes the result
# checkable: the three normal Reynolds stresses should agree and the shear
# components should vanish, and the later window should carry the lower TKE.
# Physical-time weighting keeps that true if the timestep ever varies.
field_statistics:
  enabled: true
  windows:
    - name: early_decay
      start_time: 0.2
      end_time: 0.8
      weighting: physical_time
      step_cadence: 5
      fields:
        - {field: Ucat, moments: [first, second]}
        - {field: P, moments: [first]}
        - {field: Nu_t, moments: [first]}
      covariances:
        - [Ucat, P]
    - name: late_decay
      start_time: 1.2
      end_time: 2.0
      weighting: physical_time
      step_cadence: 5
      fields:
        - {field: Ucat, moments: [first, second]}
        - {field: P, moments: [first]}
        - {field: Nu_t, moments: [first]}
      covariances:
        - [Ucat, P]
solver_monitoring:
  momentum:
    newton_krylov_history: true
    snes_monitor: false
    snes_converged_reason: true
    ksp_monitor: false
    ksp_converged_reason: true
  poisson: {pic_true_residual: true, true_residual: false, converged_reason: true, view: false}
