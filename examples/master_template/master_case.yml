# ==============================================================================
#                 PICurv Master Case Configuration Template
# ==============================================================================
#
# PURPOSE:
# This file defines the complete physical setup for a single simulation experiment.
# It describes the geometry, fluid properties, run duration, physical models,
# and boundary conditions. It is the "digital lab notebook" for your run.
#
# SECTIONS OVERVIEW:
#   0. title:               Human-readable name; the prefix of every run ID.
#   1. run_control:         How long the simulation runs and at what time resolution.
#   2. properties:          The core physical numbers (density, viscosity, scales).
#   3. grid:                The geometric domain, either from a file or generated.
#   4. models:              Switches to turn on/off different physics modules (LES, particles, etc.).
#   5. boundary_conditions: What happens at the edges of the domain.
#
# YAML SYNTAX NOTE:
#   - Indentation matters! Use spaces, not tabs.
#   - For lists, ensure there is a space after the hyphen (e.g., "- item").
#   - For more details: https://learnxinyminutes.com/docs/yaml/
#
# FILE PATHS:
#   Inside a workspace (a directory made by `picurv init`), every relative path
#   in this file resolves against the workspace root, not against this file.
#   Absolute paths and paths that escape the workspace ("../") are refused.
#   Bring outside data in with `picurv inputs import <kind> <source>`; kinds and
#   destinations are grid -> inputs/grids, initial-condition ->
#   inputs/initial_conditions, inlet-profile -> inputs/inlet_profiles,
#   reference-field -> inputs/reference_fields. `--mode reference` records an
#   external file without copying it; name the written `<name>.reference.yml`.
#
# ==============================================================================

# Optional. Run IDs are `<title>_<timestamp>`; without a title the file stem is
# used. `picurv init` sets it to the template name.
title: "master_template"

# ==============================================================================
# 1. SIMULATION CONTROL
#    Defines the duration and temporal resolution of the experiment.
# ==============================================================================
run_control:
  # The simulation step number to start from.
  # 0 for a new run, or a specific step number for a restart.
  start_step: 0

  # Total number of timesteps to execute in this run.
  # Total simulation time = total_steps * dt_physical.
  total_steps: 2000

  # Restart: use the --restart-from CLI flag to point at a previous run
  # directory. See `picurv run --help` for details.

  # The physical time increment for each step, in seconds [s].
  dt_physical: 0.001

# ==============================================================================
# 2. PHYSICAL PROPERTIES
#    Defines the non-dimensional scaling and material properties.
# ==============================================================================
properties:
  # --- Scaling ---
  # These reference values are used to non-dimensionalize the problem for the solver.
  scaling:
    length_ref: 0.05    # [m] Characteristic length of the domain (e.g., pipe diameter, chord length).
    velocity_ref: 1.5   # [m/s] Characteristic velocity (e.g., inlet velocity, freestream velocity).

  # --- Fluid ---
  # Properties of the fluid being simulated.
  fluid:
    density: 1000.0     # [kg/m^3]
    viscosity: 0.001    # [Pa.s or kg/(m.s)]

  # --- Initial Conditions ---
  # The state of the fluid at the start of the simulation (t=0).
  # Values are in physical units [m/s].
  initial_conditions:
    # Built into the solver:  zero | constant | streamwise_constant | poiseuille
    # Python providers run by picurv before the solve (single block, staged grid):
    #   ic_gen | spectral_random_velocity | channel_spectral_velocity | duct_spectral_velocity
    # Python providers need a grid picurv can read before launch: `file` or
    # `grid_gen`, or `programmatic_c` for ic_gen only. Their payload is always
    # written to <run.inputs>/initial_condition/; destination keys (output_file,
    # summary_json, spectrum_csv) are refused. `picurv precompute` builds it
    # without running the solver.
    mode: generated
    generator: constant
    params:
      u_physical: 0.0   # [m/s]
      v_physical: 0.0
      w_physical: 1.0

    # --- Generator: streamwise_constant ---
    # Sets every cell to the same scalar speed along the dominant flow axis.
    # Infers flow_direction from the INLET face when one exists; otherwise,
    # flow_direction is required.
    # mode: generated
    # generator: streamwise_constant
    # params:
    #   velocity_physical: 1.0        # [m/s] Speed along the flow axis
    #   flow_direction: "+Zeta"       # "+Xi" | "-Xi" | "+Eta" | "-Eta" | "+Zeta" | "-Zeta"
    #                                 # Optional when a single INLET face is present.

    # --- Generator: poiseuille ---
    # A product of 1-D parabolas in logical coordinates, one per wall-bounded axis:
    # zero on WALL faces, peak_velocity_physical at the centre, and uniform along
    # periodic axes. It is not the exact square-duct series solution; for that, use
    # an inlet `prescribed_flow` profile from square_duct_poiseuille.
    # flow_direction is required (or inferred from INLET face).
    # mode: generated
    # generator: poiseuille
    # params:
    #   peak_velocity_physical: 1.5   # [m/s] Centerline (maximum) velocity
    #   flow_direction: "+Zeta"       # Same options as streamwise_constant

    # --- File IC: one PETSc .dat velocity field, staged for ReadFieldData. ---
    # mode: file
    # field: Ucat       # Ucat | Ucont
    # source_file: inputs/initial_conditions/velocity.dat  # via `picurv inputs import initial-condition`

    # --- External deterministic generator (ic_gen), materialized during run/precompute. ---
    # Repository ic.gen supports file, grid_gen, and programmatic_c grids.
    # For programmatic_c, scalar programmatic_settings are first materialized as the
    # <run.inputs>/grid/grid.run bridge. Evaluates an INI [expression] section.
    # mode: generated
    # generator: ic_gen
    # params:
    #   field: Ucat                 # Ucat | Ucont
    #   script: tools/custom_ic.py  # Optional; defaults to generators/ic.gen
    #   config_file: config/initial_conditions/expression.cfg
    #   cli_args: []                # Optional raw tokens appended to the generator call

    # --- Spectral random velocity: triply periodic box, all faces PERIODIC/geometric. ---
    # Seeded Gaussian field shaped by a spectrum, optionally projected solenoidal and
    # rescaled. The decaying_isotropic_turbulence example uses this block.
    # mode: generated
    # generator: spectral_random_velocity
    # params:
    #   field: Ucat
    #   seed: 12345
    #   random: { distribution: gaussian, mean: [0.0, 0.0, 0.0] }
    #   spectrum:                   # white (default) | k4_exponential
    #     type: k4_exponential
    #     k0: 4.0                   # Energy-peak wavenumber
    #     k_cut: 20.0               # Must not exceed the two-thirds resolution limit
    #   projection: { type: solenoidal, operator: picurv_discrete }  # or { type: none }
    #   normalization: { type: component_rms, target: 1.0 }          # or { type: none }
    #   remove_mean: true

    # --- Wall-bounded spectral seed: channel (one wall pair) or duct (two). ---
    # A divergence-free perturbation (discrete curl of a seeded vector potential with a
    # wall envelope) on a flux-normalized mean. Requires a single Cartesian block with
    # uniform periodic axes: WALL/noslip pairs on wall_axes, PERIODIC elsewhere, and
    # only the streamwise pair driven (constant_flux or initial_flux). Velocities are
    # in solver units. The turbulent_channel example uses this block.
    # mode: generated
    # generator: channel_spectral_velocity   # or duct_spectral_velocity
    # params:
    #   field: Ucat
    #   seed: 12345
    #   wall_axes: [j]              # channel default [j]; duct default [i, j]
    #   streamwise_axis: k          # Must be periodic
    #   bulk_velocity: 1.0          # Mean of the startup profile
    #   perturbation_rms: 0.1
    #   wall_modes: 3               # Wall-normal modes; wall_modes + 1 <= cells/2 per wall axis
    #   spectrum: { type: k4_exponential, k0: 4.0, k_cut: 8.0 }
    #   initial_spectra:            # Optional plane/line spectra of the seed, periodic axes only
    #     - { task: plane_spectrum, axes: [i, k], fixed_indices: { j: 8 }, subtract_mean: sample }

# ==============================================================================
# 3. GRID DEFINITION
#    Defines the computational mesh for the simulation.
# ==============================================================================
grid:
  # --- Mode Selection ---
  # Determines how the grid is provided to the solver.
  # Options: 'file', 'programmatic_c', or 'grid_gen'.
  mode: programmatic_c

  # --- Optional Global DMDA Layout (applies to all grid modes) ---
  # Edit or remove these for parallel runs. The product must equal the total
  # MPI process count (-n) when all three are set.
  da_processors_x: 2
  da_processors_y: 2
  da_processors_z: 4

  # --- Option A: Grid from File ---
  # Use this if you have a pre-generated grid file.
  # The script validates and non-dimensionalizes coordinates using 'length_ref'.
  # source_file: "inputs/grids/my_premade_grid.picgrid"   # via `picurv inputs import grid`

  # --- Option B: Grid via Python Grid Generator (generators/grid.gen) ---
  # Use this for complex curvilinear meshes generated before solver launch.
  # generator:
  #   config_file: "config/grids/plane_channel_retau180.cfg"       # Required today. Workspace-relative.
  #   grid_type: "box"                 # Optional override: box | sweep
  #   # `box` is a Cartesian block whose walls may be shaped; `sweep` carries a
  #   # cross-section along a centreline. See 48_Grid_Generator_Guide.
  #   cli_args:                        # Optional raw CLI token list
  #     - "--ncells-i"
  #     - "96"
  #     - "--ncells-j"
  #     - "96"
  # Destinations are not configurable: PICurv writes the grid, its .vts preview,
  # and its .info quality report into the run's own asset store.

  # --- Option C: Programmatic Grid Generation in C ---
  # Use this to have the C solver generate a structured Cartesian grid.
  # `im/jm/km` are cell counts in YAML; picurv converts them to node counts
  # before emitting `-im/-jm/-km` for the C runtime.
  programmatic_settings:
    # --- Cell Counts ---
    im: 64              # [Cells in i-direction]
    jm: 32              # [Cells in j-direction]
    km: 128             # [Cells in k-direction]

    # --- Domain Bounds (in physical units [m]) ---
    xMins: 0.0          # [Min x-coordinate]
    xMaxs: 1.0          # [Max x-coordinate]
    yMins: 0.0
    yMaxs: 0.5
    zMins: 0.0
    zMaxs: 2.0

    # --- Grid Stretching Ratios ---
    # 1.0 = uniform. >1.0 = stretching towards max coordinate.
    rxs: 1.0
    rys: 1.05
    rzs: 1.0

    # --- Periodic Seam Formula Flag ---
    # This block is always built as a stretched Cartesian box; nothing here can produce
    # cylindrical/O-grid coordinates. `cgrids` only selects which formula the C metric
    # routines use to reconstruct ghost cells at a periodic seam: 0 (default) assumes a
    # translationally periodic box, 1 assumes a coincident-node wrap-around (annulus).
    # Setting 1 on this Cartesian geometry corrupts the periodic metric. Leave at 0.
    # -> -cgrids
    cgrids: 0

# ==============================================================================
# 4. MODEL SELECTION
#    User-friendly switches to enable different physical models and features.
#    If a section or key is omitted, the C-code's default will be used.
# ==============================================================================
models:
  # --- Core Physics Modules ---
  physics:
    dimensionality: "3D" # Options: "3D" (default), "2D" (sets -TwoD 1: the i velocity
                         # component is held fixed; the grid is unchanged)

    particles:
      count: 0             # [Integer] -> -numParticles
      init_mode: "Surface" # [string] -> -pinit. Options: "Surface", "Volume", "PointSource", "SurfaceEdges"
      restart_mode: "init" # [string] -> -particle_restart_mode. Options: "init", "load"
      random_seed: 12345   # [Integer, optional] -> -particle_random_seed. 0..2147483647; seeds
                           # initial placement and Brownian draws (default 12345)
      point_source:        # Required only when init_mode = "PointSource" (maps to -psrc_x/-psrc_y/-psrc_z)
        x: 0.5
        y: 0.5
        z: 0.5

    turbulence:
      # Preferred structured LES form. Legacy shorthand is still accepted:
      #   les: false       -> -les 0
      #   les: true        -> -les 1 (constant Smagorinsky)
      #   les: 1           -> constant Smagorinsky
      #   les: 2           -> dynamic Smagorinsky
      # All four models are experimental: implemented and unit-tested, not yet
      # validated against a reference flow. See docs/pages/07_Case_Reference.md.
      # Each model's own parameters are refused under the others.
      les:
        # [Boolean] -> -les 0 when false
        enabled: false

        # Which subgrid closure to evaluate. Only needed when enabled: true.
        #   constant_smagorinsky -> a prescribed coefficient; no coefficient field is
        #                           allocated, checkpointed, or synchronized.
        #   dynamic_smagorinsky  -> the Germano-Lilly procedure measures the
        #                           coefficient from the resolved field each update.
        #   vreman               -> resolved per grid direction from the cell's own
        #                           edges; vanishes in pure shear; takes no filter_width.
        #   wale                 -> vanishes in pure shear and falls correctly toward a
        #                           wall; one scalar width, so pair with scotti.
        # [String] -> -les
        # model: "constant_smagorinsky"

        # The fixed Smagorinsky constant. constant_smagorinsky only.
        # [Number] -> -les_constant_cs
        constant_cs: 0.03

        # Model constant c. vreman only. Vreman (2004): 2.5 Cs^2 = 0.07 for Cs = 0.17.
        # [Number] -> -les_vreman_coefficient
        # vreman_coefficient: 0.07

        # Model constant C_w. wale only. Nicoud & Ducros (1999) calibrate 0.55-0.60.
        # [Number] -> -les_wale_coefficient
        # wale_coefficient: 0.5

        # Recompute the dynamic coefficient every N steps. dynamic_smagorinsky only;
        # the constant model has nothing to recompute.
        # [Integer] -> -les_dynamic_frequency
        dynamic_frequency: 1

        # How each cell's grid filter width Delta is derived.
        #   cube_root_volume -> (cell volume)^(1/3); exact for a cube and increasingly
        #                       optimistic as the cell is stretched.
        #   geometric_mean   -> geometric mean of the cell's extents along its own grid
        #                       directions; equals cube_root_volume on orthogonal cells.
        #   max_edge         -> the longest extent; for wall-modelled or hybrid runs, not
        #                       a wall-resolved mesh, where it swamps the wall layer.
        #   scotti           -> cube root corrected for the cell's aspect ratios; the
        #                       choice for moderately stretched wall-resolved cells.
        # [String] -> -les_filter_width
        filter_width: "cube_root_volume"

        # The explicit second filter the dynamic procedure compares against the grid
        # filter. A bare string is accepted as shorthand for naming only the kernel.
        test_filter:
          #   volume_weighted_box -> general curvilinear grids.
          #   simpson_ik          -> more accurate, but assumes xi and zeta are
          #                          homogeneous; rejected unless both are PERIODIC.
          # [String] -> -les_test_filter_kernel
          kernel: "volume_weighted_box"

          # Test-to-grid filter width ratio. alpha is its square. Must exceed 1: a test
          # filter no wider than the grid filter leaves nothing to measure.
          # [Number] -> -les_test_filter_width_ratio
          width_ratio: 2.0

        # Lilly's least-squares closure assumes the coefficient is constant across the
        # averaging set, so the set should span directions the flow is homogeneous in.
        averaging:
          #   local       -> pointwise; the only choice valid on arbitrary geometry.
          #   homogeneous -> average over the directions named below, or over the
          #                  periodic axes when none are named. A triply periodic box
          #                  gives one coefficient; a channel gives a wall-normal profile.
          #   global      -> average over the whole domain regardless of boundaries.
          # [String] -> -les_averaging_mode
          mode: "local"

          # Explicit homogeneous directions, overriding the periodic default.
          # homogeneous mode only.
          # [List] -> -les_averaging_directions
          # directions: ["i", "k"]

        clipping:
          #   clamp         -> restrict to [0, max_cs^2].
          #   clip_negative -> discard negatives, impose no ceiling.
          #   none          -> keep the signed coefficient, so backscatter survives.
          # Discarding the negative tail removes backscatter and biases the mean
          # dissipation upward; the floor below is the safer way to bound the model.
          # [String] -> -les_clip_mode
          mode: "clamp"

          # Ceiling on Cs, not on the stored coefficient. clamp mode only; naming it
          # under another mode is an error, since no ceiling would be in force.
          # [Number] -> -les_clip_max_cs
          max_cs: 0.3

          # Enforce nu + nu_t >= ratio * nu. Bounds the quantity that actually has to
          # stay positive for the momentum operator to remain well posed.
          # [Number] -> -les_min_viscosity_ratio
          min_viscosity_ratio: 0.0

        # The Clark gradient (tensor-diffusivity) term, added to the viscous flux.
        # Combined with a Smagorinsky closure this is the mixed model. Available under
        # both momentum solver families; the Newton-Krylov preconditioner does not model
        # it, so watch Krylov counts if you enable it.
        gradient_model:
          # [Boolean] -> -les_gradient_model
          enabled: false

        # Per-step coefficient statistics appended to output/analysis/metrics/les_coefficient.csv:
        # the effective Cs, its spread, eddy-viscosity levels, the modelled subgrid
        # energy, and the fractions of the domain backscattering or limited before
        # clipping. Those last two describe a state no stored field preserves.
        diagnostics:
          # [Boolean] -> -les_diagnostics
          enabled: false

          # Steps between rows.
          # [Integer] -> -les_diagnostics_cadence
          cadence: 1

          # Yoshizawa constant C_I for the reported subgrid kinetic energy,
          # k_sgs = 2 C_I Delta^2 |S|^2. Affects the k_sgs_mean column only, never the
          # eddy viscosity or the momentum equations. Compare it against the resolved
          # turbulent kinetic energy from monitor.yml -> field_statistics to judge how
          # much of the energy the grid resolves.
          # [Number] -> -les_yoshizawa_ci
          yoshizawa_ci: 0.09

      # There is no RANS selector: the closure is planned, not implemented, and a
      # `rans:` block is refused at validation. Use `les` above, or run laminar.

      # Wall functions are independent of the LES closure and apply on WALL faces. The
      # correction is applied inside the momentum solve's boundary pass and again
      # before the LES strain rates are formed, so the closure and the momentum
      # equation agree about the near-wall velocity.
      wall_function:
        # [Boolean] -> -wallfunction 0 when false
        enabled: false

        # Which wall law to apply. Only needed when enabled: true.
        #   log_law -> logarithmic profile with roughness; iterative friction velocity
        #   werner  -> Werner-Wengle power law; explicit, no roughness, valid into the
        #              viscous sublayer, and free of the inner iteration that a
        #              matrix-free Jacobian amplifies
        #   cabot   -> integrated mixing-length eddy viscosity. The pressure gradient
        #              its non-equilibrium form needs is supplied as zero, so it
        #              currently reduces to the equilibrium form.
        # [String] -> -wallfunction
        # model: "log_law"

        # Wall roughness height. Used by log_law only; werner and cabot ignore it.
        # [Number] -> -wall_roughness
        roughness_height: 1.0e-16
  
# ==============================================================================
# 5. BOUNDARY CONDITIONS
#    Defines the behavior at each of the 6 faces of the computational domain.
# ==============================================================================
# --- Provide a list of 6 face definitions, one per face. ---
# --- Geometric periodicity: set both opposite faces to PERIODIC/geometric.
#     Periodic axes are derived from these BC pairs. The paired grid surfaces
#     must match pointwise under one nonzero constant Cartesian translation,
#     and the axis must contain at least four physical nodes. Periodic particle
#     wrapping is not implemented. See examples/periodic_test/. ---
boundary_conditions:
  - face: "-Xi"
    type: WALL
    handler: noslip
    
  - face: "+Xi"
    type: WALL
    handler: noslip

  - face: "-Eta"
    type: INLET
    handler: constant_velocity
    params:
      vx: 1.5  # Physical velocity [m/s]
      vy: 0.0
      vz: 0.0

    # Alternative inlet profile from a precomputed PICSLICE file:
    # handler: prescribed_flow
    # params:
    #   source:
    #     type: file
    #     path: inputs/inlet_profiles/inlet.picslice  # via `picurv inputs import inlet-profile`
    #
    # Alternative generated analytical square-duct Poiseuille profile:
    # handler: prescribed_flow
    # params:
    #   source:
    #     type: generated
    #     generator: square_duct_poiseuille
    #     script: tools/custom_profile.py  # Optional; defaults to generators/profile.gen
    #     params:
    #       bulk_velocity: 1.5
    #       n_terms: 101
    #
    # Alternative profile sliced from an old Cartesian Ucat field. The target grid
    # must be file or grid_gen. Import the old run's files first, e.g.
    #   picurv inputs import reference-field <old_run>/output/checkpoints/<step>/eulerian/block_0000/Ucat.dat --mode reference
    #   picurv inputs import grid <old_run>/inputs/grid/grid.run --name old_grid.run
    # Generated profiles are written under <run.inputs>/inlet_profiles/; output_file is refused.
    # handler: prescribed_flow
    # params:
    #   source:
    #     type: field_slice
    #     script: tools/custom_profile.py  # Optional; defaults to generators/profile.gen
    #     field_file: inputs/reference_fields/Ucat.dat.reference.yml
    #     grid_file: inputs/grids/old_grid.run
    #     source_case: config/old_case.yml  # A copy of the old case.yml, or velocity_scale: <old U_ref>
    #     source_block: 0                   # Optional
    #     slice:
    #       face: "+Eta"
    #       orientation: opposite
      
  - face: "+Eta"
    type: OUTLET
    handler: conservation

  - face: "-Zeta"
    type: WALL
    handler: noslip

  - face: "+Zeta"
    type: WALL
    handler: noslip

# --- All Supported BC Handlers (reference) ---
#
# WALL faces:
#   handler: noslip                     No-slip (zero velocity) wall.
#
# INLET faces:
#   handler: constant_velocity          Uniform Cartesian velocity.
#     params: { vx: 1.5, vy: 0.0, vz: 0.0 }
#
#   handler: parabolic                  Fully-developed parabolic (Poiseuille) profile.
#     params: { v_max: 1.5 }           v_max = centerline (peak) velocity [m/s].
#
#   handler: prescribed_flow            Profile from a file, generator, or field slice.
#     params:
#       source:
#         type: file
#         path: inputs/inlet_profiles/inlet.picslice
#
#       # OR generate analytically:
#       # source:
#       #   type: generated
#       #   generator: square_duct_poiseuille
#       #   params:
#       #     bulk_velocity: 1.5
#       #     n_terms: 101
#
#       # OR slice from an existing Ucat field:
#       # source:
#       #   type: field_slice
#       #   field_file: inputs/reference_fields/Ucat.dat.reference.yml
#       #   grid_file: inputs/grids/old_grid.run
#       #   source_case: config/old_case.yml
#       #   slice:
#       #     face: "+Eta"
#       #     orientation: opposite
#
# OUTLET faces:
#   handler: conservation               Mass-conservation outflow correction.
#
# PERIODIC faces (must appear as matching opposite pairs):
#   handler: geometric                  Pure geometric periodicity (no driving force).
#     type: PERIODIC
#   handler: constant_flux              Drives a constant volume flux through the periodic pair.
#     type: PERIODIC
#     params:
#       target_flux: 1.0              Target volumetric flux in PHYSICAL units [m^3/s]; picurv
#                                     divides it by (U_ref * L_ref^2) before the C runtime.
#       enforce_seam_flux: false      [true/false] Optional, default false. Adds a local
#                                     correction to the face fluxes of the periodic SEAM PLANE
#                                     so the flux through that one plane matches the target.
#                                     The body force already holds the bulk flux; this only
#                                     addresses the seam. Leave false unless Bcs.Uch shows a
#                                     persistently large seam mismatch - enabling it can
#                                     reintroduce divergence and injects single-plane noise.
#                                     `apply_trim` is accepted as a deprecated alias.
#   handler: initial_flux               Like constant_flux, but holds the flux of the initial
#     type: PERIODIC                    condition instead of a configured target. Takes no
#     params: {}                        target_flux; enforce_seam_flux is optional.

# ==============================================================================
# 6. ADVANCED PASSTHROUGH (OPTIONAL)
# ------------------------------------------------------------------------------
# Use this for C flags not yet exposed in the structured schema.
# Keys must be full C/PETSc-style flags (including leading '-').
# ==============================================================================
# solver_parameters:
#   -some_new_flag: 123
