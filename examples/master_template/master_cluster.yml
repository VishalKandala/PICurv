# ==============================================================================
#                 PICurv Master Cluster Configuration (Slurm v1)
# ==============================================================================
#
# This file defines scheduler/resource settings used by:
#   picurv run   --cluster cluster.yml ...
#   picurv sweep --cluster cluster.yml ...
#
# In v1, scheduler.type must be "slurm".
# Run IDs are not configured here; picurv derives them as <label>_<timestamp>,
# where the label is case.yml `title` (study.yml `title` for a sweep) or else the
# file stem, and uses them to name scheduler jobs.
# ==============================================================================

scheduler:
  type: slurm

resources:
  # These resources size both solver- and postprocessor-stage jobs.
  account: "my_project_account"
  partition: "compute"        # optional
  nodes: 2
  ntasks_per_node: 32
  mem: "128G"
  time: "02:00:00"

notifications:
  mail_user: "user@example.edu"  # optional, validated when set
  mail_type: "END,FAIL"          # optional

execution:
  # Shell lines injected before launch command.
  module_setup:
    - "module purge"
    - "module restore petsc-setup"
    # Open MPI 4.1 on Lustre: ROMIO reads and writes checkpoint files faster than the default
    # OMPIO driver when OMPIO has no Lustre component (see the Monitor Reference, io section).
    # - "export OMPI_MCA_io=romio321"
    # Open MPI 4.1 where the btl/ofi component can deadlock in MPI_Init: exclude it here, not
    # only in launcher_args, because picurv starts a 1-rank local run without the launcher.
    # - "export OMPI_MCA_pml=ucx OMPI_MCA_btl=^uct,ofi OMPI_MCA_mtl=^ofi"

  # Launcher and args are batch-specific overrides.
  # If your site uses the same launcher tokens for login-node and batch runs,
  # put them in `.picurv-execution.yml` and only override them here when needed.
  # Removing these keys lets batch jobs inherit from `.picurv-execution.yml`.
  launcher: "srun"               # alternatives: "mpirun", custom launcher
  launcher_args: []              # e.g. ["--cpu-bind=cores"] or ["-mca", "pml", "ucx"]
  # Each launcher_args entry must be one CLI token.
  # Do not write: ["-mca pml ucx -mca btl ^uct,ofi"]
  # Multi-word launcher strings are accepted, but the portable form is:
  # launcher: "mpirun"
  # launcher_args: ["-mca", "pml", "ucx"]
  # MPI decomposition (ranks along i, j, k); the product must equal
  # nodes * ntasks_per_node. Omit it to let `picurv` choose the decomposition
  # that cuts the least grid area among those the multigrid levels accept.
  # decomposition: {i: 1, j: 4, k: 16}
  # Generated Slurm solver jobs enable this runtime walltime guard by default.
  # Uncomment only when you need to override the defaults:
  # walltime_guard:
  #   enabled: true
  #   warmup_steps: 10
  #   multiplier: 2.0
  #   min_seconds: 60
  #   estimator_alpha: 0.35

  # Optional pass-through SBATCH flags.
  # dict form:
  # extra_sbatch:
  #   qos: "high"
  #   constraint: "zen4"
  # list form:
  # extra_sbatch:
  #   - "--qos=high"
  #   - "--constraint=zen4"
