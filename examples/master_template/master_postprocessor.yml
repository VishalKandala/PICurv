# ==============================================================================
#                 PICurv Master Post-Processing Profile
# ==============================================================================
#
# This file is the definitive template for post-processing tasks, derived
# directly from the capabilities of the C post-processor executable. All options
# here map to specific, implemented C functions and configuration keys.
#
# Use this as a guide to create specific analysis profiles (e.g., standard_analysis.yml).
#
# ==============================================================================
# SECTION 1: SOURCE DATA & RUN CONTROL
# ------------------------------------------------------------------------------
# Defines where to find the input data and which timesteps to process.
# This section directly configures the main processing loop in the C executable.
# ==============================================================================
source_data:
  # (Required) The directory containing the input solver data files (.dat).
  #
  # SPECIAL TOKEN: "<solver_output_dir>"
  #   The picurv script replaces this with the solver's output directory.
  #   This is the standard and recommended setting.
  directory: "<solver_output_dir>"

run_control:
  # (Required) The first timestep in the logical analysis window.
  # Maps to 'startTime' in the generated C-side post.run recipe.
  # Keep this at the true beginning of the recipe window you care about.
  # When you launch `picurv run --post-process --continue`, PICurv may
  # internally resume at a later effective step for the same recipe without
  # requiring you to edit this value.
  start_step: 0

  # (Required) The last timestep in the logical analysis window.
  # A value of -1 means "process up to the last available step".
  # On live solver runs, PICurv caps each launch to the highest fully
  # available contiguous source step before generating `post.run`.
  # Maps to 'endTime' in the generated C-side post.run recipe.
  end_step: -1

  # (Optional) The interval for processing steps (e.g., 100 means process
  # steps 0, 100, 200...). Defaults to 1.
  # Must be a multiple of monitor.yml -> io.data_output_frequency: the solver only
  # commits a checkpoint at that cadence, so a finer stride names steps that were
  # never written. Validation rejects a mismatch rather than letting the run stop
  # at the first missing step.
  # Maps to 'timeStep' in the generated C-side post.run recipe.
  step_interval: 100

# ==============================================================================
# SECTION 2: GLOBAL OPERATIONS
# ------------------------------------------------------------------------------
# These are operations that apply to the entire dataset at the beginning of each
# timestep's processing.
# ==============================================================================
global_operations:
  # (Optional) If true, converts all loaded fields (grid and data) to physical,
  # dimensional units before any other processing.
  # Corresponds to adding `DimensionalizeAllLoadedFields` to the C-side pipeline.
  dimensionalize: true

# ==============================================================================
# SECTION 3: PROCESSING PIPELINE
# ------------------------------------------------------------------------------
# Defines a sequence of operations to perform on the loaded data. The picurv
# script will serialize these lists into semicolon-separated strings for the
# C executable's 'process_pipeline' and 'particle_pipeline' keys.
# ==============================================================================
eulerian_pipeline:

  # Computes the Q-Criterion for vortex identification.
  # Creates a new field named "Qcrit".
  # Invokes the C function: `ComputeQCriterion()`.
  - task: q_criterion

  # (Optional) Performs cell-to-node averaging on specified fields.
  # For each field in the list (e.g., 'P'), this computes a new field
  # named with a "_nodal" suffix (e.g., 'P_nodal').
  # Invokes the C function: `ComputeNodalAverage(user, "P", "P_nodal")`.
  - task: nodal_average
    input_field:  'P'
    output_field: 'P_nodal'

  - task: nodal_average
    input_field:  'Ucat'
    output_field: 'Ucat_nodal'

  # (Optional) Normalizes a relative field (like pressure) by subtracting
  # the value at a specific grid index.
  # Invokes the C function: `NormalizeRelativeField()`.
  - task: normalize_field
    # The field to normalize. Currently, only "P" is supported by the C code.
    field: 'P'
    # The [i, j, k] grid indices of the reference point. The Python script will
    # generate 'reference_ip', 'reference_jp', 'reference_kp' keys in post.run.
    reference_point: [1, 1, 1]

# --- Lagrangian (Particle-Based) Pipeline ---
lagrangian_pipeline:
  # A list of operations performed on particle data.
  # Computes the specific kinetic energy (0.5 * |v|^2) for each particle.
  # Creates a new particle field named "specific_ke".
  # Invokes the C function: `ComputeSpecificKE()`.
  - task: specific_ke
    input_field: 'velocity'
    output_field: 'ske'

# --- Global Particle Statistics Pipeline ---
# Optional reduction kernels that append CSV diagnostics per timestep.
# NOTE: Requires particle data in solver outputs (np > 0 at solve time).
statistics_pipeline:
  # Optional base name for CSV outputs (default: "Stats")
  output_prefix: "Stats"
  tasks:
    # Mean-square displacement based on simCtx->psrc_x/y/z reference point.
    - task: msd

# Deprecated: statistics_output_prefix at the top level was an older way to
# specify the statistics CSV prefix. Use statistics_pipeline.output_prefix instead.
# statistics_output_prefix: "Stats"

# --- Eulerian Field Statistics Recipe ---
# Derives saved accumulator state into scientific turbulence quantities. This is
# a separate contract from statistics_pipeline above: that one reduces particle
# trajectories, this one reads the field windows the solver accumulated through
# monitor.yml -> field_statistics.
#
# The recipe names windows rather than redescribing them, because the window
# definitions already reach the post-processor through the run's solver control.
# Omit this block to derive nothing.
# field_statistics:
#   # Window names, matching monitor.yml. Each window writes its own files, so a
#   # name may not be repeated.
#   windows: ["production"]
#
#   # Read every window's state from this step instead of from the step being
#   # processed. Omit to follow the processed step, which is what makes the CSV
#   # a convergence history rather than one row repeated.
#   # source_step: 4000
#
#   # Which derived quantities to write. Each resolves against what the window
#   # actually accumulated: a window keeping only first moments has no stresses,
#   # RMS, or TKE to give, and a recipe that would produce an empty file is
#   # rejected before the run rather than after it.
#   #   mean            -> the window mean of every accumulated field
#   #   reynolds_stress -> centered second moments; six components for a vector
#   #   rms             -> per-component root mean square of the fluctuation
#   #   tke             -> turbulent kinetic energy, for vector fields
#   #   flux            -> the cross-field co-moments listed under covariances
#   outputs: ["mean", "reynolds_stress", "rms", "tke", "flux"]
#
#   # vtk writes the derived fields as one .vts per window per processed step.
#   # csv appends one row per processed step to a per-window convergence history,
#   # recording sample count, weight, represented time, mask coverage, and the
#   # domain-mean TKE when the window has one.
#   formats: ["vtk", "csv"]

# --- Turbulent Energy Spectra ---
# Measures energy spectra from the instantaneous velocity in each committed
# checkpoint. Unlike every other block on this page, spectra are not computed by
# the C post-processor: the conductor runs generators/spectra.gen against the raw
# checkpoint payloads, so this stage needs no field output and does not depend on
# eulerian_pipeline. Omit the block to measure nothing.
#
# Run it on its own with:
#   picurv run --post-process --only spectra --run-dir <run> --post post.yml
# Re-measuring a spectrum is cheap; rebuilding the .vts output is not, so the
# analysis loop belongs behind --only spectra.
#
# OUTPUTS. Each task writes two CSVs under <monitor output>/spectra/: the spectra
# themselves as step,time,k,energy, and a per-step history beside them recording
# resolved_kinetic_energy, spectrum_total_energy, parseval_residual,
# spectrum_peak_k, zero_mode_energy, integral_length_scale, taylor_microscale,
# and dissipation_over_viscosity. Dissipation is divided by the kinematic
# viscosity, which the measurement does not need; both length scales need none
# either. parseval_residual is a self-check rather than an input: summed shell
# energy must equal the resolved kinetic energy of the transformed field, so a
# residual above round-off means the measurement is wrong.
#
# View the results with:
#   picurv summarize --run-dir <run> --plot-spectrum
#   picurv summarize --run-dir <run> --plot spectra.resolved_kinetic_energy
#
# PRECONDITIONS. A spectrum is only defined where the transform direction is
# uniformly spaced, periodic, and statistically homogeneous. shell_spectrum
# therefore requires every face PERIODIC, a single block, and a uniform
# axis-aligned Cartesian grid. picurv validate checks this against case.yml
# before any field is read, so a wall-bounded or curvilinear case is refused by
# name rather than producing a curve with no meaning. A channel or a bend cannot
# use this block.
# spectra:
#   # Prefix for the CSV basenames written under <monitor output>/spectra/.
#   output_prefix: "Spectrum"
#
#   tasks:
#     - task: shell_spectrum
#
#       # Catalogued field to transform. Ucont is component-staggered and has no
#       # single cell-centered spectrum, so it is not accepted.
#       field: Ucat
#
#       # Block index within the PICGRID.
#       block: 0
#
#       # Binning abscissa.
#       #   continuum -> bins by |k|
#       #   discrete  -> bins by the centered-difference symbol sin(k dx)/dx,
#       #                which is what the solver's own operator resolves.
#       # Reading a high-k rolloff against the continuum abscissa alone will
#       # attribute the scheme's damping to physics.
#       # The abscissa applies to the binning and to the k^2 moment, so
#       # dissipation_over_viscosity legitimately differs between the two: the
#       # discrete operator resolves less gradient and so dissipates less.
#       # integral_length_scale is the exception. Its 1/k moment is singular
#       # under the discrete symbol, which vanishes on the Nyquist planes, so it
#       # is always taken on the physical wavenumber and reads the same either way.
#       symbol: continuum
#
#       # Fluctuation definition.
#       #   none            -> transform the field as stored
#       #   domain          -> remove the volume mean of that snapshot
#       #   window:<name>   -> subtract an accumulated field-statistics window
#       #                      mean, which is the better estimate wherever the
#       #                      flow is not homogeneous
#       # A window mean is only defined where the window actually sampled, so a
#       # window that has not accumulated over the domain is refused rather than
#       # subtracted as zero.
#       subtract_mean: none
#
#       # Bundle the window mean is read from, independent of the step being
#       # transformed. Applies only to subtract_mean: window:<name>. Left unset,
#       # each step reads its own bundle, whose running mean is undefined at the
#       # moment the window activates. Pin it at or after the window closes to
#       # subtract the converged mean.
#       # mean_source_step: 4000
#
#       # Optional baseline to overlay when plotting. The placeholder resolves to
#       # the spectrum recorded for a generated initial condition.
#       # reference: "<ic_spectrum>"

# ==============================================================================
# SECTION 4: OUTPUT CONFIGURATION
# ------------------------------------------------------------------------------
# Controls what data is written to the final VTK files.
# ==============================================================================
io:
  # (Required) The directory where output files will be saved, relative to the
  # main run directory (e.g., 'runs/my_run_id/'). The picurv script will
  # create this directory if it does not exist.
  # picurv prepends this path onto the generated 'output_prefix' and
  # 'particle_output_prefix' entries in post.run.
  output_directory: "visualization/standard_analysis"

  # (Required) The base name for the Eulerian output files. The C code will append
  # the timestep and extension, e.g., "eulerian_data_00100.vts".
  # Combined with output_directory to form 'output_prefix' in post.run.
  output_filename_prefix: "eulerian_data"

  # (Optional) The base name for particle output files. Defaults to "Particle".
  # Combined with output_directory to form 'particle_output_prefix' in post.run.
  # Maps to 'particle_filename_prefix' in post.run.
  particle_filename_prefix: "Particle"

  # (Required) List of Eulerian fields to save to the output .vts files.
  # You can include original fields ('P', 'Ucat') and newly computed fields
  # from the pipeline ('Qcrit', 'P_nodal', 'Ucat_nodal').
  # Maps to 'output_fields_instantaneous' in post.run.
  eulerian_fields:
    - 'Ucat_nodal'
    - 'Qcrit'
    - 'P_nodal'

  # (Optional) A master switch for all particle-related output. Defaults to false.
  # Maps to 'output_particles' in post.run.
  output_particles: true

  # (Optional) List of particle fields to save to the output .vtp files.
  # Can include original fields and newly computed fields like 'specific_ke'.
  # Standard Swarm Fields: 'position', 'velocity', 'pid', 'CellID', 'weight'
  # Maps to 'particle_fields_instantaneous' in post.run.
  particle_fields:
    - 'velocity'
    - 'pid'
    - 'specific_ke'

  # (Optional) The frequency for subsampling particles for output.
  # A value of 1 saves every particle. A value of 10 saves every 10th particle.
  # Defaults to 1 if not specified.
  # Maps to 'particle_output_freq' in post.run.
  particle_subsampling_frequency: 1

  # (Optional) Checkpoint payload extension contract. Committed bundles use
  # fixed PETSc-vector .dat payloads, so both values must remain "dat".
  input_extensions:
    eulerian: "dat"
    particle: "dat"
