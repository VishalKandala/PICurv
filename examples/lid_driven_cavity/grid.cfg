# Unit square in x (i) and y (j), periodic along z (k), so the flow is two-dimensional.
# Counts below are CELLS. k is not coarsened; see solver.yml.
[box]
ncells_i = 64
ncells_j = 64
ncells_k = 8
bounds_x = 0.0 1.0
bounds_y = 0.0 1.0
bounds_z = 0.0 0.125
periodic = k
mg_levels = 3
show_stats = yes
write_vtk = no
