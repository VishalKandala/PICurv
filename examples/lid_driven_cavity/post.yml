# Velocity and pressure at the nodes of the checkpoints, for a centreline cut.
run_control:
  start_step: 0
  end_step: 3000
  step_interval: 500
global_operations:
  dimensionalize: true
eulerian_pipeline:
- task: nodal_average
  input_field: P
  output_field: P_nodal
- task: nodal_average
  input_field: Ucat
  output_field: Ucat_nodal
io:
  output_filename_prefix: cavity
  eulerian_fields:
  - Ucat_nodal
  - P_nodal
  output_particles: false
  input_extensions:
    eulerian: dat
    particle: dat
